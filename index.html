<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>🎸 Песенник</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
    <div class="overlay" id="overlay"></div>

    <!-- ====== САЙДБАР ====== -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>🎸 Песенник v1.3</h2>
            <div class="header-buttons">
                <button id="addSongBtn" class="icon-btn" title="Новая песня">➕</button>
                <button id="syncStatusBtn" class="icon-btn" title="Статус синхронизации">📊</button>
                <button id="downloadZipBtn" class="icon-btn" title="Скачать всё ZIP">📦</button>
                <button id="refreshCsvBtn" class="icon-btn" title="Обновить список песен">⟳</button>
                <button id="converterIconBtn" class="icon-btn" title="Конвертер">🔄</button>
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Поиск песен...">
        </div>
        <div class="song-list-container" id="songListContainer">
            <div class="loading-msg">Загрузка...</div>
        </div>
    </div>

    <!-- ====== ОСНОВНОЙ КОНТЕНТ ====== -->
    <div class="content">
        <div class="toolbar">
            <button class="menu-toggle" id="menuToggleBtn" title="Меню">☰</button>
            <div class="controls">
                <button id="transposeDownBtn" title="Понизить на полутон">♭ -1</button>
                <span class="transpose-value" id="transposeAmount">0</span>
                <button id="transposeUpBtn" title="Повысить на полутон">♯ +1</button>
                <button id="resetTransposeBtn" class="secondary-btn" title="Сбросить тональность">⟳ Сброс</button>
                <button id="capoDisplay" class="capo-display" title="Каподастр"></button>
                <button id="verseNavUpBtn" class="secondary-btn" title="К предыдущему куплету">↑ Куплет</button>
                <button id="verseNavDownBtn" class="secondary-btn" title="К следующему куплету">↓ Куплет</button>
            </div>
        </div>
        <div class="song-view" id="songView">
            <div class="no-song-msg">🎵 Выберите песню из списка</div>
        </div>
    </div>
</div>

<!-- ====== ПАНЕЛЬ РЕДАКТОРА ====== -->
<div id="adminPanel">
    <div class="admin-header">
        <h3 id="editSongTitle">✏️ Редактирование</h3>
        <button id="closeEditorBtn" class="admin-close-btn">✕ Закрыть</button>
    </div>
    <textarea id="editTextarea" spellcheck="false"></textarea>
    <div class="admin-buttons">
        <button id="cancelEditBtn" class="btn-cancel">Отмена</button>
        <button id="saveEditBtn" class="btn-save">💾 Сохранить</button>
    </div>
</div>

<!-- Подключаем JSZip для создания ZIP-архивов -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<!-- ====== ПОДКЛЮЧАЕМ СКРИПТЫ ====== -->
<script src="script.js"></script>
<script src="editor.js"></script>

</body>
</html>
