<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>🎸 Песенник — аккорды над текстом</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: #e9eef3;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
        }
        .app {
            display: flex;
            height: 100%;
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        
        .sidebar {
            width: 280px;
            background: #1e2a3e;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            transition: transform 0.25s ease;
            z-index: 20;
            box-shadow: 2px 0 12px rgba(0,0,0,0.1);
            height: 100%;
            overflow: hidden;
        }
        .sidebar-header {
            padding: 1rem;
            background: #0f1724;
            border-bottom: 1px solid #2d3e4f;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            flex-shrink: 0;
        }
        .sidebar-header h2 { font-size: 1.3rem; }
        .header-buttons { display: flex; gap: 8px; }
        .icon-btn {
            background: #2c3e50;
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.1s;
        }
        .icon-btn:hover { background: #3e5a6e; transform: scale(0.95); }
        
        .search-box { 
            padding: 12px 16px; 
            background: #15232e; 
            border-bottom: 1px solid #2c3e46;
            flex-shrink: 0;
        }
        .search-box input {
            width: 100%; padding: 10px 14px; font-size: 1rem;
            border: none; border-radius: 40px; background: #2c3e44;
            color: white; outline: none;
        }
        .search-box input::placeholder { color: #9aaebf; }
        .song-list-container { 
            flex: 1; 
            overflow-y: auto; 
            padding: 8px 0;
            -webkit-overflow-scrolling: touch;
        }
        .song-item {
            padding: 12px 18px;
            cursor: pointer;
            border-left: 4px solid transparent;
            transition: 0.1s;
            position: relative;
        }
        .song-item:hover { background: #2c3e50; }
        .song-item.active { background: #2c5a74; border-left-color: #f1c40f; }
        .song-title-small { font-size: 1rem; }
        .song-artist-small { font-size: 0.7rem; color: #b0c4de; margin-top: 3px; }
        .transpose-badge {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: #f1c40f; color: #1e2a3e; font-size: 0.65rem;
            padding: 2px 6px; border-radius: 20px;
        }
        
        .content { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background: #fef9ef; 
            overflow: hidden;
            height: 100%;
        }
        .toolbar {
            background: white; 
            padding: 12px 16px; 
            display: flex;
            align-items: center; 
            justify-content: flex-end; 
            gap: 12px;
            border-bottom: 1px solid #ddd;
            flex-shrink: 0;
        }
        .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .controls button {
            background: #2c3e50; border: none; color: white;
            padding: 8px 14px; border-radius: 40px; cursor: pointer;
            font-size: 0.85rem;
        }
        .transpose-value { background: #e2e6ea; padding: 6px 12px; border-radius: 30px; font-weight: bold; font-size: 0.85rem; }
        .menu-toggle {
            display: none; background: #1e2a3e; border: none;
            font-size: 1.5rem; padding: 6px 12px; border-radius: 12px;
            cursor: pointer; color: white; margin-right: auto;
        }
        
        .song-view { 
            flex: 1; 
            overflow-y: auto; 
            padding: 1rem 1.2rem;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }
        
        .song-line { margin-bottom: 0; }
        .chord-row {
            font-family: 'Courier New', 'Fira Code', monospace;
            font-weight: bold; color: #b45309;
            font-size: 0.9rem; line-height: 1.3; white-space: pre;
            height: 1.3em;
        }
        .lyric-row { 
            font-size: 1rem; 
            line-height: 1.35; 
            white-space: pre-wrap; 
            color: #2c3e50; 
            word-break: break-word;
        }
        .section-label { 
            font-weight: 600; 
            color: #5d6e7e; 
            margin-top: 0.8rem; 
            margin-bottom: 0.3rem;
            font-size: 0.9rem;
        }
        .song-title { 
            font-size: 1.3rem; 
            font-weight: 700; 
            margin-bottom: 0.2rem; 
            border-left: 4px solid #f1c40f; 
            padding-left: 14px;
            word-break: break-word;
        }
        .song-artist { 
            font-size: 0.85rem; 
            color: #5d6e7e; 
            margin-bottom: 1.2rem; 
            padding-left: 18px;
            word-break: break-word;
        }
        .no-song-msg { text-align: center; margin-top: 80px; color: #7f8c8d; padding: 20px; }
        .error-msg { background: #f9e6e6; padding: 20px; border-radius: 16px; margin: 20px; color: #c0392b; }
        
        .info-hint {
            padding: 12px 16px;
            background: #15232e;
            border-top: 1px solid #2c3e46;
            font-size: 0.7rem;
            color: #9aaebf;
            text-align: center;
            flex-shrink: 0;
        }
        
        @media (max-width: 720px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100%;
                transform: translateX(-100%);
                z-index: 30;
            }
            .sidebar.open { transform: translateX(0); }
            .menu-toggle { display: inline-block; }
            .toolbar { justify-content: flex-start; padding: 10px 12px; }
            .song-view { padding: 0.8rem 1rem; }
            .controls button { padding: 6px 12px; font-size: 0.8rem; }
            .chord-row { font-size: 0.85rem; }
            .lyric-row { font-size: 0.95rem; }
            .song-title { font-size: 1.2rem; }
        }
        
        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 25;
        }
        .overlay.active { display: block; }
    </style>
</head>
<body>
<div class="app">
    <div class="overlay" id="overlay"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>🎸 Песенник</h2>
            <div class="header-buttons">
                <button id="refreshCsvBtn" class="icon-btn" title="Обновить список песен">⟳</button>
                <button id="converterIconBtn" class="icon-btn" title="Конвертер старых песен">🔄</button>
            </div>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Поиск песен...">
        </div>
        <div class="song-list-container" id="songListContainer">
            <div style="padding:20px; text-align:center;">Загрузка...</div>
        </div>
        <div class="info-hint">
            💡 Аккорды: [C] [Am] [G7] [Cmaj7] [Bm7] [Cm+7] — всё распознаётся
        </div>
    </div>

    <div class="content">
        <div class="toolbar">
            <button class="menu-toggle" id="menuToggleBtn">☰</button>
            <div class="controls">
                <button id="transposeDownBtn">♭ -1</button>
                <span class="transpose-value" id="transposeAmount">0</span>
                <button id="transposeUpBtn">♯ +1</button>
                <button id="resetTransposeBtn" style="background:#6c757d;">⟳ Сброс</button>
            </div>
        </div>
        <div class="song-view" id="songView">
            <div class="no-song-msg">🎵 Выберите песню из списка</div>
        </div>
    </div>
</div>

<script>
    let songsList = [];
    let currentSongId = null;
    let currentRawOriginal = "";
    let transposeShift = 0;
    let songTransposes = {};
    
    const STORAGE_TRANSPOSES = 'songbook_transposes';
    const STORAGE_LAST_SONG = 'songbook_last_song';

    // РАСШИРЕННОЕ РАСПОЗНАВАНИЕ АККОРДОВ
    // Поддерживает: C, Am, G7, Dm7, Cmaj7, Bm7-5, C+, C+7, G6, Am6, F#m, C#dim и т.д.
    function isChordLike(str) {
        // Убираем лишние пробелы
        str = str.trim();
        if (str === "") return false;
        
        // Паттерн для аккордов:
        // 1. Буква (A-G) или H (нотация)
        // 2. Необязательные # или b
        // 3. Необязательная буква m (минор) или maj, min, dim, aug, sus
        // 4. Необязательная цифра (7, 9, 11, 13)
        // 5. Необязательные + или - или /bass
        // 6. Необязательный суффикс (m7, maj7, m7-5 и т.д.)
        const chordPattern = /^[A-GH](?:[#b])?(?:m|maj|min|dim|aug|sus)?(?:[0-9])?(?:\+)?(?:[0-9])?(?:[-\/])?[A-GH]?(?:[0-9])?$/i;
        
        // Дополнительные сложные аккорды
        const complexPattern = /^[A-GH][#b]?(?:m|maj|min)?(?:[0-9])?(?:\+)?[0-9]?$/i;
        
        // Если строка длинная и содержит русские буквы — это не аккорд
        if (str.length > 8 && /[а-яА-Я]/.test(str)) return false;
        
        // Если строка содержит только аккордовые символы
        return chordPattern.test(str) || complexPattern.test(str) || /^[A-GH][#b]?[m]?[0-9]?[\+]?[0-9]?$/i.test(str);
    }

    // Функция для извлечения чистого названия аккорда (без лишних символов для транспонирования)
    function extractChordBase(chordStr) {
        // Убираем всё, кроме буквы, #, b, m, и цифр (для транспонирования)
        let match = chordStr.match(/^[A-GH][#b]?(?:m|maj|min)?/i);
        if (match) return match[0];
        return chordStr;
    }

    async function loadSongsFromCSV(forceRefresh = false) {
        try {
            let url = 'songs/songs.csv';
            if (forceRefresh) url += '?t=' + Date.now();
            const response = await fetch(url, {
                cache: 'no-store',
                headers: { 'Cache-Control': 'no-cache' }
            });
            if (!response.ok) throw new Error('CSV не найден');
            const csvText = await response.text();
            const songs = parseCSV(csvText);
            songs.sort((a, b) => a.title.localeCompare(b.title, 'ru'));
            
            songsList = songs.map((song, idx) => ({
                id: `song_${idx}`,
                title: song.title,
                artist: song.artist,
                fileName: song.fileName
            }));
            
            renderSongList();
            
            if (forceRefresh && currentSongId) {
                const stillExists = songsList.some(s => s.id === currentSongId);
                if (stillExists) {
                    await loadSongById(currentSongId, false, true);
                } else if (songsList.length > 0) {
                    await loadSongById(songsList[0].id, true, true);
                }
            } else {
                const lastSongId = localStorage.getItem(STORAGE_LAST_SONG);
                if (lastSongId && songsList.some(s => s.id === lastSongId)) {
                    await loadSongById(lastSongId, true, forceRefresh);
                } else if (songsList.length > 0 && !currentSongId) {
                    await loadSongById(songsList[0].id, true, forceRefresh);
                }
            }
        } catch(e) {
            document.getElementById('songListContainer').innerHTML = `
                <div style="padding:20px;color:#e74c3c;">
                    ❌ Файл songs/songs.csv не найден
                </div>`;
        }
    }

    function parseCSV(csvText) {
        const lines = csvText.split(/\r?\n/);
        if (lines.length < 2) return [];
        const result = [];
        for (let i = 1; i < lines.length; i++) {
            const line = lines[i].trim();
            if (line === "") continue;
            const parts = line.split(',');
            if (parts.length >= 3) {
                let artist = parts[0].trim();
                let title = parts[1].trim();
                let fileName = parts[2].trim();
                artist = artist.replace(/^["']|["']$/g, '');
                title = title.replace(/^["']|["']$/g, '');
                fileName = fileName.replace(/^["']|["']$/g, '');
                if (title && fileName) result.push({ title, artist, fileName });
            }
        }
        return result;
    }

    function loadSavedTransposes() {
        const saved = localStorage.getItem(STORAGE_TRANSPOSES);
        if (saved) { try { songTransposes = JSON.parse(saved); } catch(e) {} }
    }

    function saveCurrentTranspose() {
        if (currentSongId && transposeShift !== 0) {
            songTransposes[currentSongId] = transposeShift;
        } else if (currentSongId && transposeShift === 0) {
            delete songTransposes[currentSongId];
        }
        localStorage.setItem(STORAGE_TRANSPOSES, JSON.stringify(songTransposes));
        updateTransposeBadge();
    }

    function saveLastSong(songId) { if (songId) localStorage.setItem(STORAGE_LAST_SONG, songId); }
    function loadLastSong() { return localStorage.getItem(STORAGE_LAST_SONG); }

    function updateTransposeBadge() {
        document.querySelectorAll('.song-item').forEach(item => {
            const songId = item.dataset.id;
            const shift = songTransposes[songId];
            const existingBadge = item.querySelector('.transpose-badge');
            if (existingBadge) existingBadge.remove();
            if (shift && shift !== 0) {
                const badge = document.createElement('span');
                badge.className = 'transpose-badge';
                badge.textContent = shift > 0 ? `+${shift}` : `${shift}`;
                item.appendChild(badge);
            }
        });
    }

    // Улучшенный парсер строк с аккордами
    function formatSongWithChordsFixed(rawText) {
        const lines = rawText.split(/\r?\n/);
        let resultHtml = '';
        
        for (let line of lines) {
            if (line.trim() === '') { 
                resultHtml += '<div style="height: 0.5rem;"></div>'; 
                continue; 
            }
            
            const chordPattern = /\[([^\]]+)\]/g;
            let hasBrackets = chordPattern.test(line);
            chordPattern.lastIndex = 0;
            
            if (hasBrackets) {
                let chords = [];
                let textChunks = [];
                let lastIndex = 0;
                let match;
                
                while ((match = chordPattern.exec(line)) !== null) {
                    const bracketContent = match[1].trim();
                    if (match.index > lastIndex) {
                        textChunks.push({ type: 'text', content: line.substring(lastIndex, match.index) });
                    }
                    if (isChordLike(bracketContent)) {
                        chords.push({ chord: bracketContent, position: match.index });
                    } else {
                        textChunks.push({ type: 'text', content: bracketContent });
                    }
                    lastIndex = match.index + match[0].length;
                }
                if (lastIndex < line.length) {
                    textChunks.push({ type: 'text', content: line.substring(lastIndex) });
                }
                
                let cleanLine = '';
                for (let chunk of textChunks) {
                    if (chunk.type === 'text') cleanLine += chunk.content;
                }
                
                if (chords.length > 0) {
                    let chordLineArray = new Array(cleanLine.length).fill(' ');
                    for (let chord of chords) {
                        let tempRaw = 0, tempClean = 0;
                        while (tempRaw < chord.position && tempRaw < line.length) {
                            if (line[tempRaw] !== '[' && line[tempRaw] !== ']') tempClean++;
                            tempRaw++;
                        }
                        let chordText = chord.chord;
                        for (let j = 0; j < chordText.length && tempClean + j < chordLineArray.length; j++) {
                            chordLineArray[tempClean + j] = chordText[j];
                        }
                    }
                    let chordLine = chordLineArray.join('').trimEnd();
                    resultHtml += `<div class="song-line">`;
                    if (chordLine.trim()) resultHtml += `<div class="chord-row">${escapeHtml(chordLine)}</div>`;
                    resultHtml += `<div class="lyric-row">${escapeHtml(cleanLine)}</div></div>`;
                } else {
                    // Строка только с текстовыми метками (типа [Вступление])
                    let finalText = '';
                    for (let chunk of textChunks) {
                        if (chunk.type === 'text') finalText += chunk.content;
                    }
                    if (finalText.trim()) {
                        resultHtml += `<div class="section-label">${escapeHtml(finalText.trim())}</div>`;
                    }
                }
            } else {
                resultHtml += `<div class="song-line"><div class="lyric-row">${escapeHtml(line)}</div></div>`;
            }
        }
        return resultHtml;
    }

    function escapeHtml(str) { 
        return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); 
    }

    // Транспонирование аккордов (поддерживает сложные аккорды)
    function transposeChordInString(text, semitones) {
        const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B', 'H'];
        
        function transposeChord(chordRaw) {
            let base = chordRaw;
            let originalIsH = false;
            if (base.toUpperCase().startsWith('H')) { 
                originalIsH = true; 
                base = 'B' + base.slice(1); 
            }
            
            // Находим корень аккорда (буква с возможными # или b)
            let rootMatch = base.match(/^[A-G][#b]?/i);
            if (!rootMatch) return chordRaw;
            
            let rootNote = rootMatch[0];
            let suffix = base.slice(rootNote.length);
            
            let index = notes.findIndex(n => n.toLowerCase() === rootNote.toLowerCase());
            if (index === -1) return chordRaw;
            
            let newIndex = (index + semitones + 12) % 12;
            let newRoot = notes[newIndex];
            
            let result = newRoot + suffix;
            if (originalIsH && result.startsWith('B')) {
                result = 'H' + result.slice(1);
            }
            return result;
        }
        
        return text.replace(/\[([^\]]+)\]/g, (match, content) => {
            if (isChordLike(content)) {
                return `[${transposeChord(content)}]`;
            }
            return match;
        });
    }

    function updateSongDisplay() {
        if (!currentSongId || !currentRawOriginal) { 
            document.getElementById('songView').innerHTML = '<div class="no-song-msg">🎵 Выберите песню</div>'; 
            return; 
        }
        let transposedRaw = transposeShift !== 0 ? transposeChordInString(currentRawOriginal, transposeShift) : currentRawOriginal;
        const song = songsList.find(s => s.id === currentSongId);
        if (!song) return;
        const titleHtml = `<div class="song-title">${escapeHtml(song.title)}</div><div class="song-artist">${escapeHtml(song.artist)}</div>`;
        document.getElementById('songView').innerHTML = titleHtml + formatSongWithChordsFixed(transposedRaw);
        document.getElementById('transposeAmount').innerText = transposeShift;
        const songView = document.querySelector('.song-view');
        if (songView) songView.scrollTop = 0;
    }

    async function loadSongById(id, saveToStorage = true, forceRefresh = false) {
        const song = songsList.find(s => s.id === id);
        if (!song) return;
        try {
            let url = `songs/${encodeURIComponent(song.fileName)}`;
            if (forceRefresh) url += '?t=' + Date.now();
            const response = await fetch(url, {
                cache: 'no-store',
                headers: { 'Cache-Control': 'no-cache' }
            });
            if (!response.ok) throw new Error('Файл не найден');
            currentRawOriginal = await response.text();
            currentSongId = id;
            transposeShift = songTransposes[id] || 0;
            updateSongDisplay();
            document.querySelectorAll('.song-item').forEach(el => { el.classList.toggle('active', el.dataset.id === id); });
            if (saveToStorage) saveLastSong(id);
            if (window.innerWidth <= 720) closeSidebar();
        } catch(e) {
            document.getElementById('songView').innerHTML = `<div class="error-msg">❌ Ошибка загрузки ${song.fileName}</div>`;
        }
    }

    function changeTranspose(delta) { 
        if (!currentSongId) return; 
        transposeShift = Math.min(7, Math.max(-7, transposeShift + delta)); 
        updateSongDisplay(); 
        saveCurrentTranspose(); 
    }
    function resetTranspose() { 
        if (!currentSongId) return; 
        transposeShift = 0; 
        updateSongDisplay(); 
        saveCurrentTranspose(); 
    }

    function renderSongList(filterText = "") {
        const container = document.getElementById('songListContainer');
        let filtered = filterText ? songsList.filter(s => s.title.toLowerCase().includes(filterText.toLowerCase()) || s.artist.toLowerCase().includes(filterText.toLowerCase())) : [...songsList];
        if (filtered.length === 0) { 
            container.innerHTML = '<div style="padding:20px;text-align:center;color:#aaa;">🎵 Нет песен</div>'; 
            return; 
        }
        container.innerHTML = "";
        filtered.forEach(song => {
            const div = document.createElement('div');
            div.className = 'song-item' + (currentSongId === song.id ? ' active' : '');
            div.dataset.id = song.id;
            div.innerHTML = `<div class="song-title-small">${escapeHtml(song.title)}</div><div class="song-artist-small">${escapeHtml(song.artist)}</div>`;
            div.addEventListener('click', () => loadSongById(song.id, true, true));
            container.appendChild(div);
        });
        updateTransposeBadge();
    }

    async function refreshSongsList() {
        const refreshBtn = document.getElementById('refreshCsvBtn');
        refreshBtn.innerHTML = '⏳';
        await loadSongsFromCSV(true);
        refreshBtn.innerHTML = '⟳';
    }

    function openSidebar() { 
        document.getElementById('sidebar').classList.add('open'); 
        document.getElementById('overlay').classList.add('active'); 
    }
    function closeSidebar() { 
        document.getElementById('sidebar').classList.remove('open'); 
        document.getElementById('overlay').classList.remove('active'); 
    }
    function openConverter() { window.open('converter.html', '_blank'); }

    document.addEventListener('DOMContentLoaded', () => {
        loadSavedTransposes();
        loadSongsFromCSV(false);
        document.getElementById('searchInput').addEventListener('input', (e) => renderSongList(e.target.value));
        document.getElementById('transposeUpBtn').addEventListener('click', () => changeTranspose(1));
        document.getElementById('transposeDownBtn').addEventListener('click', () => changeTranspose(-1));
        document.getElementById('resetTransposeBtn').addEventListener('click', resetTranspose);
        document.getElementById('menuToggleBtn').addEventListener('click', openSidebar);
        document.getElementById('overlay').addEventListener('click', closeSidebar);
        document.getElementById('converterIconBtn').addEventListener('click', openConverter);
        document.getElementById('refreshCsvBtn').addEventListener('click', refreshSongsList);
        window.addEventListener('resize', () => { if (window.innerWidth > 720) closeSidebar(); });
    });
</script>
</body>
</html>
